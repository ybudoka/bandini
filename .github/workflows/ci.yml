name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Un push qui en remplace un autre annule la CI du precedent. Rien ne se met
# en ligne d'ici (le deploiement se fait a la main sur le serveur).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ⚠️ LES TESTS TOURNENT EN LOCAL SEULEMENT (decision de Martin, 17 sept. 2026).
  # La suite (~2 450 juges, banc Node et Chromium compris) ne tenait plus dans le
  # delai d'un runner : le run de `main` de 0.115.0 est mort coupe a 25 min, a
  # 94 % et sans un juge tombe, et tous les runs de `dev` de la meme heure avec
  # lui. On livrait en attendant une verification qui ne finissait plus.
  #
  # Ici ne reste que ce qui prend quelques secondes et ne ment jamais : les
  # dependances synchronisees et le lint. Le verdict qui autorise une mise en
  # ligne est la suite COMPLETE, navigateur compris, verte EN LOCAL sur le commit
  # exact qu'on pousse sur `main` (voir docs/exploitation.md, « Tests et CI »).
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Installer les dependances
        run: uv sync --all-groups
      - name: Verifier la synchronisation requirements.txt / pyproject.toml
        run: uv run python scripts/verifier_dependances.py
      - name: Lint
        run: uv run ruff check .
